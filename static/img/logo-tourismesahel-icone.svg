<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
    <!-- Soleil doré + rayons -->
    <g fill="#D6A84B">
        <circle cx="32" cy="25" r="15"/>
        <rect x="31" y="2" width="2" height="5" rx="1"/>
        <rect x="31" y="2" width="2" height="5" rx="1" transform="rotate(-45 32 25)"/>
        <rect x="31" y="2" width="2" height="5" rx="1" transform="rotate(45 32 25)"/>
        <rect x="31" y="2" width="2" height="5" rx="1" transform="rotate(-90 32 25)"/>
        <rect x="31" y="2" width="2" height="5" rx="1" transform="rotate(90 32 25)"/>
    </g>
    <!-- Monument en terre (architecture soudano-sahélienne) -->
    <g fill="#A85C20">
        <path d="M29 54V24.5Q32 17 35 24.5V54z"/>
        <path d="M19 54V32.5Q21.5 27 24 32.5V54z"/>
        <path d="M40 54V32.5Q42.5 27 45 32.5V54z"/>
        <rect x="19" y="40" width="26" height="14"/>
    </g>
    <!-- Torons (pièces de bois saillantes) -->
    <g stroke="#5C3210" stroke-width="1.4" stroke-linecap="round">
        <line x1="27.5" y1="30" x2="36.5" y2="30"/>
        <line x1="27.5" y1="35" x2="36.5" y2="35"/>
        <line x1="17.5" y1="37" x2="25.5" y2="37"/>
        <line x1="38.5" y1="37" x2="46.5" y2="37"/>
    </g>
    <!-- Porte en arc -->
    <path d="M30 54v-5q2-3.5 4 0v5z" fill="#F5EBD7"/>
    <!-- Baobab -->
    <g fill="#14532D">
        <path d="M50.5 54c1.2-4.5 1.2-9.5.3-14h4.4c-.9 4.5-.9 9.5.3 14z"/>
        <path d="M51 40.5l-3.5-3.5M55 40.5l3.5-3.5M53 40v-4" stroke="#14532D" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        <circle cx="47" cy="36" r="2.6"/>
        <circle cx="53" cy="34.5" r="3"/>
        <circle cx="59" cy="36" r="2.6"/>
    </g>
    <!-- Ligne de sol -->
    <rect x="4" y="54" width="56" height="2.5" rx="1.25" fill="#65A30D"/>
</svg>

