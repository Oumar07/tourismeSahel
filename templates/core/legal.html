{% extends "base.html" %}

{% block title %}{{ page.titre }}{% endblock %}

{% block hero %}
<section class="page-hero" style="min-height: 220px;">
    <div class="container">
        <span class="badge-ts badge-ts--gold mb-2">{{ page.badge }}</span>
        <h1 class="mb-1">{{ page.titre }}</h1>
        <p class="lead mb-0">{{ page.intro }}</p>
    </div>
</section>
{% endblock %}

{% block content %}
<section class="section">
    <div class="container" style="max-width: 860px;">
        <div class="vstack gap-4">
            {% for sous_titre, texte in page.sections %}
                <article class="p-4 rounded-ts bg-white border shadow-sm">
                    <h2 class="h5 text-green mb-2">{{ sous_titre }}</h2>
                    <p class="text-muted-ts mb-0">{{ texte }}</p>
                </article>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
